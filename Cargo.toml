[package]
name = "gifgun-agent"
version = "1.28.2"
edition = "2024"
rust-version = "1.90"
description = "Native local bridge for GifGun Online"
license = "Apache-2.0"
repository = "https://github.com/extrabiteio/gifgun-online-agent"
homepage = "https://gifgun.online"
readme = "README.md"
publish = false

[lib]
name = "gifgun_agent"
path = "src/lib.rs"

[[bin]]
name = "gifgun-agent"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
futures-util = "0.3.31"
getrandom = "0.3.4"
jsonschema = { version = "0.49.7", default-features = false }
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["io"] }
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
